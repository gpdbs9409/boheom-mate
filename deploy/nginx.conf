# boheommate.duckdns.org를 HTTPS로 받아 Streamlit(8501)으로 넘긴다. Streamlit은 웹소켓을 쓰므로 Upgrade 헤더가 필요하다
# 인증서는 deploy/setup.sh가 certbot(Let's Encrypt)으로 받고, certbot.timer가 자동 갱신한다

# http로 오거나 IP로 오면 https 도메인 주소로 보낸다
server {
    listen 80 default_server;
    server_name _;
    return 301 https://boheommate.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name boheommate.duckdns.org;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/boheommate.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boheommate.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 검색엔진용 파일. 주소를 바꾸면 두 파일 안의 주소도 바꾼다
    location = /robots.txt  { root /var/www/boheom-mate; }
    location = /sitemap.xml { root /var/www/boheom-mate; }

    # 첫 화면 HTML. Streamlit 원본에는 제목이 "Streamlit"뿐이라 검색엔진이 읽을 제목·설명을 끼워 넣는다
    location = / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";   # 압축되면 sub_filter가 글자를 바꾸지 못한다
        sub_filter_once off;
        sub_filter '<html lang="en">' '<html lang="ko">';
        sub_filter '<title>Streamlit</title>' '<title>보험메이트 - 실손보험 약관 AI 질의응답</title>
    <meta name="description" content="실손의료보험 약관을 근거로 보장 여부를 답하고 근거 조항 원문까지 보여 주는 AI 질의응답 서비스" />
    <link rel="canonical" href="https://boheommate.duckdns.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boheommate.duckdns.org/" />
    <meta property="og:title" content="보험메이트 - 실손보험 약관 AI 질의응답" />
    <meta property="og:description" content="실손의료보험 약관을 근거로 보장 여부를 답하고 근거 조항 원문까지 보여 주는 AI 질의응답 서비스" />';
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300;
    }
}
